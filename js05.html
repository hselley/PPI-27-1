<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serie de ULAM</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-light: #6b7280;
            --border-radius: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        p.subtitle {
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 15px;
            font-size: 1.1rem;
            border: 1px solid #d1d5db;
            border-radius: var(--border-radius);
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.primary {
            background-color: var(--primary);
            color: white;
            border: none;
        }

        button.primary:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #e5e7eb;
            color: var(--text-main);
            border: none;
        }

        button.secondary:hover {
            background-color: #d1d5db;
        }

        #resultado {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: #f9fafb;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--primary);
            text-align: left;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.6;
            color: var(--text-main);
            min-height: 24px; /* Evita saltos bruscos si está vacío */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Serie de ULAM</h1>
        <p class="subtitle">Ingresa un número entero positivo para generar la secuencia</p>
        
        <form onsubmit="ulam();">
            <div class="input-group">
                <input type="number" id="numero" min="1" onchange="ulam()" placeholder="Ejemplo: 7" required>
            </div>
            
            <div class="button-group">
                <button type="button" class="primary" onclick="ulam()">Calcular</button>
                <button type="button" class="secondary" onclick="borrar()">Borrar</button>
            </div>
        </form>
        <div id="resultado" class="hidden">Los resultados aparecerán aquí...</div>
    </div>
    <script>
        function borrar() {
            document.getElementById("resultado").innerHTML = "";
            document.getElementById("numero").value = "";
        }

        function ulam() {
            
            // Obtención del valor en el input
            valorInput = document.getElementById("numero").value;
            console.log(valorInput);
            valor = parseInt(valorInput);
            console.log(valor);
            resultado = valorInput;
            
            // Cálculo de la serie
            while(valor != 1) {
                if(valor%2 == 0) { 
                    // par
                    valor /= 2;
                } else {
                    // impar
                    valor = valor*3 + 1;
                }
                console.log(valor);
                resultado = resultado + ' -> ' + valor;
            }
            document.getElementById("resultado").innerHTML = resultado;
        }
    </script>
</body>
</html>
