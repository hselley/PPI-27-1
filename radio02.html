<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extracción Radio #2</title>
    <script>
        function extraccion() {
            var gen = document.getElementsByName("genero");
            var salida = document.getElementById("resultado");
            var cad = "";
            var genero;

            // Segundo método: mejora del clásico
            x = document.querySelector('input[name=genero]:checked');
            if(x!=null) {
                genero = x.value;
                console.log(genero);
                cad = "Su genero es " + genero + ".";
            }
            

            if(genero != null) {
                salida.innerHTML = cad;
            } else {
                salida.innerHTML = "Seleccione una opción";
            }
        }   
    </script>
</head>
<body>
    <h1>Extracción Radio #2</h1>
    <p>Extracción del valor del input tipo <code>radio</code></p>
    <h3>Elija su género:</h3>
    <form action="">
        <input type="radio" name="genero" id="mas" value="Masculino"> 
        <label for="mas">Masculino</label><br>
        <input type="radio" name="genero" id="fem" value="Femenino"> 
        <label for="fem">Femenino</label><br>
        <input type="radio" name="genero" id="otro" value="Otro"> 
        <label for="otro">Otro</label><br>
        <input type="radio" name="genero" id="nulo" value="Nulo"> 
        <label for="nulo">Me ofende la elección</label><br>
    </form>
    <button onclick="extraccion()">Seleccionar</button>
    <p id="resultado"></p>
</body>
</html>
