<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Cíclico</title>
    <script>
        function borrar() {
            document.getElementById("resultado").innerHTML = "";
            document.getElementById("numero").value = "";
        }
        function obtenerNumero() {
            valor = document.getElementById("numero").value;
            console.log("Obtenemos valor");
            var x = parseInt(valor);
            console.log("Llamamos a la función");
            factorial(x);
            console.log(x);
        }
        function factorial(x) {
            var f = 1;
            for(i=1; i<=x; i++) {
                f *= i;
                console.log(f);
            }
            salida = x + "! = " + f;
            document.getElementById("resultado").innerHTML = salida;
        }
    </script>
</head>
<body>
    <h1>Factorial cíclico</h1>
    <p>Ingrese un número positivo</p>
    <form action="">
        <input type="number" id="numero" min="0" placeholder="Ingrese un número">
    </form>
    <button onclick="obtenerNumero()">Calcular</button>
    <button onclick="borrar()">Borrar</button>
    <p id="resultado"></p>
</body>
</html>
