<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fecha de cumpleaños</title>
    <script>
        function fecha() {
            // ------------------------------------------------------------------------------------------
            // Construcción de los objetos que almacenan las fechas de cumpleaños y hoy
            fechaInput = document.getElementById("cumple").value;
            fechaCumple = new Date(fechaInput);
            fechaHoy = new Date();  
            // ------------------------------------------------------------------------------------------

            // ------------------------------------------------------------------------------------------
            // El manejo de fechas en JavaScript + HTML es un desastre, se mezclan usos horarios 
            // y es muy fácil confundirse. Lo menos confuso es convertir la fecha del cumpleaños 
            // y de hoy a la medianoche en el UTC para hacer el cálculo.
            fechaCumple.setUTCHours(0,0,0,0);   // horas, minutos, segundos, milisegs -> medianoche UTC
            fechaHoy.setUTCHours(0,0,0,0);      // horas, minutos, segundos, milisegs -> medianoche UTC
            console.log(fechaCumple);
            console.log(fechaHoy);
            // ------------------------------------------------------------------------------------------

            // ------------------------------------------------------------------------------------------
            // Este bloque solo lo hice para desmenuzar la fecha en sus componentes, a manera de ejemplo    
            const dia = fechaCumple.getDate() + 1;
            console.log(dia);
            const mes = fechaCumple.getMonth() + 1;
            console.log(mes);
            const anio = fechaCumple.getFullYear();
            console.log(anio);
            // ------------------------------------------------------------------------------------------

            // ------------------------------------------------------------------------------------------
            // Esta forma de construir cadenas se llama 'interpolación', se usa el acento grave `
            cadena = `Tu cumpleaños es el ${dia} del mes ${mes} del año ${anio}.`; 
            document.getElementById("resultado1").innerHTML = cadena;
            // ------------------------------------------------------------------------------------------

            // ------------------------------------------------------------------------------------------
            // Determinación del tiempo faltante para el cumpleaños
            const diferenciaEnMs = fechaCumple - fechaHoy;          
            const msEnUnDia = 1000 * 60 * 60 * 24;
            // Math.ceil redondea hacia arriba el cociente 
            const diasRestantes = Math.ceil(diferenciaEnMs / msEnUnDia);
            console.log(diasRestantes);
            // ------------------------------------------------------------------------------------------

            // ------------------------------------------------------------------------------------------
            // Esto es para comprobar si ya pasó, es hoy o si falta para el cumpleaños
            if (diasRestantes < 0) {
                cadena = "¡Tu cumpleaños ya pasó este año!";
            } else if (diasRestantes == 0) {
                cadena = "¡Hoy es tu cumpleaños! ¡Felicidades!";
            } else {
                cadena = `¡Aún faltan ${diasRestantes} días para tu cumpleaños!`;
            }
            document.getElementById("resultado2").innerHTML = cadena;
            // ------------------------------------------------------------------------------------------
        }
    </script>
</head>
<body>
    <h1>Ingrese su fecha de cumpleaños</h1>
    <!-- El atributo `onchange` ejecuta la función `fecha()` cada que ocurre un cambio en el formulario -->
    <form action="" onchange="fecha()">
        <input type="date" name="cumple" id="cumple">
    </form>
    <p id="resultado1"></p>
    <p id="resultado2"></p>
</body>
</html>
