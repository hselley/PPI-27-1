<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #1b263b;
        }
        td:hover {
            background-color: #778da9;
            color: antiquewhite;
            text-align: center;
            font-size: x-large;
        }
        tr:nth-child(even) {
            background-color: #f56b09;
            color: aqua;
        }
        tr:nth-child(odd) {
            background-color: #ff0054;
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Tablas</h1>
    <!-- table>tr>th{Encabezado $}*4 -->
    <table>
        <tr>
            <th>Encabezado 1</th>
            <th>Encabezado 2</th>
            <th>Encabezado 3</th>
            <th>Encabezado 4</th>
        </tr>
        <!-- tr*4>td{Elemento $}*4 -->
         <tr>
            <td>Elemento 1</td>
            <td>Elemento 2</td>
            <td>Elemento 3</td>
            <td>Elemento 4</td>
         </tr>
         <tr>
            <td>Elemento 1</td>
            <td>Elemento 2</td>
            <td>Elemento 3</td>
            <td>Elemento 4</td>
         </tr>
         <tr>
            <td>Elemento 1</td>
            <td>Elemento 2</td>
            <td>Elemento 3</td>
            <td>Elemento 4</td>
         </tr>
         <tr>
            <td>Elemento 1</td>
            <td>Elemento 2</td>
            <td>Elemento 3</td>
            <td>Elemento 4</td>
         </tr>
    </table>
</body>
</html>
