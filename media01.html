<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
    <style>
        div.center {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Multimedia en HTML5</h1>
    <p>HTML5 soporta multimedia de forma nativa</p>
    
    <h2>Video</h2>
    <div class="center">
        <video src="vader.webm" controls width=80% muted autoplay></video>
    </div>

    <h2>Audio</h2>
    <div class="center">
        <audio src="BlackHoleSun.mp3" autoplay controls muted></audio>
    </div>

    <h2>Youtube</h2>
    <div class="center">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/e1h5TzdTq0o?si=uBlU4lqiDu1uF9me" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <h2>Facebook</h2>

    <h2>Twitter</h2>

</body>
</html>
