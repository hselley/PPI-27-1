<!DOCTYPE html>
<html lang="en">
<head>

    <title>Multimedia</title>
    <style>
        div.center {
            display: flex;
            justify-content: center;

    <p>HTML5 soporta multimedia de forma nativa</p>

    </div>

    <div class="center">
